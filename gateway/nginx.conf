# Gateway de EncomiTrack: una sola entrada para toda la suite.
# Las aplicaciones ya atienden sus rutas con prefijo (/nominas, /liquidacion),
# por eso proxy_pass va SIN URI: se reenvía la ruta completa, sin recortarla.
server {
    listen 80;
    server_name _;

    # Redirecciones relativas: conservan el host y el puerto del navegador.
    absolute_redirect off;

    # DNS interno de Docker, resuelto en cada petición: el gateway arranca
    # aunque alguna aplicación todavía esté iniciando.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Evidencias de liquidación (máx. 10 MB en el backend) y logos de nómina.
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Página de inicio de la suite.
    root /usr/share/nginx/html;
    location = / {
        try_files /index.html =404;
    }
    location /brand/ {
        expires 7d;
    }
    location = /favicon.ico {
        expires 7d;
    }

    location /emprendimiento-dashboard {
        # Documentos del portal: hasta 50 MB por archivo.
        client_max_body_size 55m;
        set $dashboard http://dashboard:3000;
        proxy_pass $dashboard;
    }

    location /nominas {
        set $nomina http://nomina:3000;
        proxy_pass $nomina;
    }

    location /liquidacion {
        set $liquidacion http://liquidacion-frontend:8080;
        proxy_pass $liquidacion;
    }
}
