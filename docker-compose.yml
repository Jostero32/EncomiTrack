# EncomiTrack · suite completa en un solo despliegue.
#
#   Local:    docker compose up -d --build   → http://localhost:8080
#             (docker-compose.override.yml se carga solo y publica el puerto)
#   Dokploy:  aplicación tipo Compose con este archivo; dominio → servicio gateway, puerto 80.
#             Ver docs/despliegue-dokploy.md
#
# El gateway (nginx) es la única entrada y enruta por subruta:
#   /                           página de inicio de la suite
#   /emprendimiento-dashboard/  Portal académico de la materia (Next.js)
#   /nominas/                   Roles de pago (Next.js + SQLite)
#   /liquidacion/               Paz y salvo y liquidación (Angular + Express + SQLite)
name: ${COMPOSE_PROJECT_NAME:-encomitrack}

services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - dashboard
      - nomina
      - liquidacion-frontend
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        BASE_PATH: /emprendimiento-dashboard
    environment:
      # Sin clave ni secreto el portal queda en solo lectura.
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Panel "Datos en vivo": consulta la API de liquidación dentro de la red de Docker.
      LIQUIDACION_API_URL: http://liquidacion-backend:3000/liquidacion/api
    volumes:
      - dashboard_data:/data/app
      # Material del semestre (Primer_Parcial/, Seundo_Parcial/), solo lectura. No se versiona.
      - ${DOCS_DIR:-./documentos}:/data/docs:ro
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nomina:
    build:
      context: ./apps/nomina
      args:
        BASE_PATH: /nominas
    environment:
      TZ: ${TZ:-America/Guayaquil}
      # 1 = si la base está vacía, carga la empresa y los empleados de ejemplo (ficticios).
      CARGAR_DATOS_EJEMPLO: ${CARGAR_DATOS_EJEMPLO:-1}
    volumes:
      - nomina_data:/app/data
    restart: unless-stopped

  liquidacion-backend:
    build:
      context: ./apps/liquidacion/backend
    environment:
      BASE_PATH: /liquidacion
      PORT: 3000
      DB_PATH: /data/app.db
      UPLOADS_DIR: /data/uploads
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - liquidacion_data:/data
    restart: unless-stopped

  liquidacion-frontend:
    build:
      context: ./apps/liquidacion/frontend
      args:
        BASE_PATH: /liquidacion
    environment:
      BASE_PATH: /liquidacion
      LISTEN_PORT: 8080
      BACKEND_URL: http://liquidacion-backend:3000
    depends_on:
      - liquidacion-backend
    restart: unless-stopped

volumes:
  dashboard_data:
  nomina_data:
  liquidacion_data:
