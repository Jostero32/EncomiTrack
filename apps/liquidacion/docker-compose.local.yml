# Solo para probar en su computadora: publica el frontend en 127.0.0.1:LOCAL_PORT.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   Abrir: http://localhost:<LOCAL_PORT><BASE_PATH>/   (p. ej. http://localhost:8080/liquidacion/)
# Escucha solo en 127.0.0.1, así no queda expuesto en la red.
services:
  frontend:
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:${FRONTEND_PORT:-8080}"
